name: Release

# Pushing a tag with the default GITHUB_TOKEN does NOT start a new workflow
# run (GitHub suppresses that to avoid infinite loops), so auto-tagging and
# building must happen in the same run rather than relying on the tag push
# to retrigger this workflow. The `build` job below runs either way:
#   - after `autotag`, when this run was triggered by a push to main
#   - directly, when this run was triggered by someone pushing a vX.Y.Z tag
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  autotag:
    name: Auto-tag release
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and create next version tag
        id: tag
        run: |
          set -euo pipefail

          git fetch --tags --force

          existing_at_head=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "$existing_at_head" ]; then
            echo "HEAD is already tagged (${existing_at_head}); reusing it."
            echo "new_tag=${existing_at_head}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new_tag="v0.1.0"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Tagging HEAD as ${new_tag}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${new_tag}"
          git push origin "${new_tag}"
          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push image
    needs: [autotag]
    if: |
      always() &&
      (github.ref_type == 'tag' || (needs.autotag.result == 'success' && needs.autotag.outputs.new_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            raw_tag="${{ github.ref_name }}"
          else
            raw_tag="${{ needs.autotag.outputs.new_tag }}"
          fi
          echo "value=${raw_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Lowercase image repository
        id: image
        run: |
          echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
